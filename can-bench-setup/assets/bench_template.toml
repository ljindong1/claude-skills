# <제품> CAN 검사 설정 — scripts/pycan/can_bench.py 가 읽는다.
#
#   python can_bench.py <이 파일>            계획만 출력 (장비 연결 안 함)
#   python can_bench.py <이 파일> --listen   받기만 (송신 없음)
#   python can_bench.py <이 파일> --run      깨우기 + 받기 + 판정 (송신함)
#
# 근거 — 값마다 어디서 왔는지 적는다. 모르는 값은 추정하지 말고 비워 두고 묻는다.
#   보율      <저장소>  Configuration\Ecu\Mcal\Ecud_Can.arxml
#   DB        <저장소>  References\DB  (최상위 = 현행)
#   IGN 신호  <출처>
#
# 모르는 항목(오타)이 있으면 can_bench 가 멈춘다. 항목 이름은 아래 것만 쓴다.

name = "<이름>"           # 결과 파일 이름이 된다

[device]
interface = "vector"
serial = "auto"           # 채널을 모두 가진 VN 장비가 한 대면 그것을 쓴다

[dut]
node = "<DBC 노드 이름>"  # 시험 대상. DBC 의 BU_ 이름 그대로
e2e = "HKMC"              # 카운터·CRC 방식. "" 이면 CRC 를 넣지도 보지도 않는다

[run]
settle_s = 2.0            # 깨어난 뒤 이 시간 동안 받은 것은 판정에서 뺀다
seconds = 10.0            # 판정에 쓰는 수신 시간. 첫 프레임부터 센다
wake_timeout_s = 10.0     # 첫 프레임을 이만큼 기다린다
cycle_tol = 0.10          # 주기 허용오차 ±10%

# ---------------------------------------------------------------- 버스 1
[[bus]]
name = "B-CAN"
channel = 0               # hw_channel (장비 표기 CH n 은 n-1). 결선을 확인한 값만 쓴다
dbc = '<절대 경로>.dbc'   # 상대 경로면 이 파일이 있는 폴더 기준이 된다 — 절대 경로로 둔다
fd = true
bitrate = 500_000
data_bitrate = 2_000_000
f_clock = 80_000_000      # Vector FD 클럭. 샘플포인트를 맞추려면 필요하다
sample_point = 80.0
data_sample_point = 75.0
simulate = "all"          # DUT 에게 보내는 ECU 전부 흉내. 목록으로 고를 수도 있다: ["CGW_CCU"]
exclude = []              # 실험대에 실물이 붙어 있는 ECU — 같은 ID 를 두 곳에서 보내면 안 된다
pn = "none"               # NM 부분 네트워크. 깨지 않으면 "all"

# 흉내 낼 때 DB 초기값 대신 보낼 신호 값 (예: IGN 켜기)
[bus.signals]
# <메시지> = { <신호> = 1 }
