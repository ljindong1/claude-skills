# PSU 운전석(GW_PSU_DRV_FD) CAN 검사 설정 — can_bench.py 가 읽는다.
#
#   python can_bench.py psu_drv.toml            계획만 출력 (장비 연결 안 함)
#   python can_bench.py psu_drv.toml --listen   받기만 (송신 없음)
#   python can_bench.py psu_drv.toml --run      깨우기 + 받기 + 판정
#
# 근거
#   보율      psu_app  Configuration\Ecu\Mcal\Ecud_Can.arxml (PSU_BCAN / PSU_L1CAN 동일)
#             중재 500k / 데이터 1M, BRS, 샘플포인트 80% / 75%
#   DB        psu_app  References\DB  2026-05 판
#   CRC       SP3i PSU CANoe 컨피그의 CAPL (HKMC 방식)
#   IGN 신호  SP3i PSU CANoe 패널이 조작하던 신호

name = "PSU_DRV"

[device]
interface = "vector"
serial = "auto"           # 연결할 때 아래 채널을 가진 VN1640A 를 찾아 쓴다 (한 대일 때).
                          # 여러 대를 꽂아 두면 시리얼 숫자로 정한다 — 목록은
                          # python -c "from CanModule import CanBase; print(CanBase.detect(['vector']))"

[dut]
node = "GW_PSU_DRV_FD"    # 시험 대상. 두 DB 모두 이 이름이다
e2e = "HKMC"              # 카운터·CRC 방식. "" 이면 CRC 를 넣지도 보지도 않는다

[run]
settle_s = 2.0            # 깨어난 뒤 이 시간 동안 받은 것은 판정에서 뺀다
seconds = 10.0            # 판정에 쓰는 수신 시간. 첫 프레임을 받은 때부터 센다
wake_timeout_s = 10.0     # 첫 프레임을 이만큼 기다린다. 끝까지 없으면 그대로 판정 (전부 "수신 없음")
cycle_tol = 0.10          # 주기 허용오차 ±10%

# ---------------------------------------------------------------- B-CAN
[[bus]]
name = "B-CAN"
channel = 2               # VN1640A 장비 표기 CH3 (hw_channel 2) — 결선 확인됨 (2026-09-28)
dbc = 'D:\Mobase\psu_master\psu_app\References\DB\20260529_STD_DB_CAR_R2.0_2024_FD_B2_v26.05.01.dbc'
bitrate = 500_000
data_bitrate = 1_000_000
f_clock = 80_000_000      # Vector FD 클럭. 샘플포인트를 맞추려면 필요하다
sample_point = 80.0
data_sample_point = 75.0
simulate = "all"          # DUT 에게 보내는 ECU 전부 흉내. 목록으로 고를 수도 있다: ["CGW_CCU"]
exclude = []              # 실험대에 실물이 붙어 있는 ECU
pn = "none"               # NM 부분 네트워크. 깨지 않으면 "all"
                          # PSU DRV 는 NM 에 PN 비트가 있지만 제어기에서 쓰지 않는다 (2026-09-30 확인:
                          # "all" 로 바꿔도 동작이 같다). 그래서 "none" 으로 둔다.

# 흉내 낼 때 DB 초기값 대신 보낼 신호 값. 초기값이 모두 Off(0) 라 IGN 을 켠다.
[bus.signals]
BDC_FD_02_200ms = { BCM_Ign1InSta = 1, BCM_Ign2InSta = 1, BCM_AccInSta = 1 }
PDC_FD_01_200ms = { IGN3State = 1 }

# ---------------------------------------------------------------- Local CAN
[[bus]]
name = "Local"
channel = 3               # VN1640A 장비 표기 CH4 (hw_channel 3) — 결선 확인됨 (2026-09-28)
dbc = 'D:\Mobase\psu_master\psu_app\References\DB\20260529_STD_DB_CAR_R2.0_2024_FD_PSU_DRV_Local_v26.05.01.dbc'
bitrate = 500_000
data_bitrate = 1_000_000
f_clock = 80_000_000
sample_point = 80.0
data_sample_point = 75.0
simulate = "all"
exclude = []
pn = "none"
